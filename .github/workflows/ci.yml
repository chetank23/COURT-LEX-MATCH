name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      VITE_API_BASE: http://127.0.0.1:4000
      NODE_ENV: test
      PORT: 4000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Migrate database
        run: npm run db:migrate

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start API server (background)
        run: node server/index.mjs &
        shell: bash

      - name: Wait for API server to be ready
        run: |
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:4000/api/health && echo "API ready" && break
            echo "Waiting for API... attempt $i"
            sleep 2
          done
        shell: bash

      - name: E2E smoke tests
        run: npm run test:e2e
